name: Locate remaining nursery addresses using Photon
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/geocode-nidi-photon.yml"
      - "tools/geocode_nidi_photon.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Geocode outstanding addresses without guessing
        run: python -u tools/geocode_nidi_photon.py
      - name: Save and audit verified coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nidi-roma/coordinates-photon.json nidi-roma/coordinates-photon-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: candidate additional nursery positions from Photon"
          git fetch origin main
          git rebase origin/main
          git push
