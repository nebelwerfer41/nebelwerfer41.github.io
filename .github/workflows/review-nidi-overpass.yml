name: Review remaining nursery locations via OpenStreetMap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-nidi-overpass.yml"
      - "tools/review_nidi_overpass.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find candidate locations without publishing unverified points
        run: python -u tools/review_nidi_overpass.py
      - name: Commit candidate audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nidi-roma/overpass-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: candidate nursery geolocations for review"
          git fetch origin main
          git rebase origin/main
          git push
